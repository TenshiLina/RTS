<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <title>Mandate of Heaven</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Noto+Serif+SC:wght@600;700&family=Alegreya+Sans:wght@400;500;700&display=swap" rel="stylesheet" />
    <style>
      :root { color-scheme: dark; }
      html, body { margin: 0; height: 100%; background: #0d0a09; overflow: hidden; }
      #view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: default; }
      #boot { position: fixed; inset: 0; display: grid; place-items: center; background: #0d0a09; color: #d9ad52; font: 600 18px Cinzel, Georgia, serif; letter-spacing: 0.12em; text-align: center; }
      #boot small { display: block; margin-top: 10px; font: 400 14px "Alegreya Sans", system-ui, sans-serif; letter-spacing: 0; color: #b3a585; }
      #error { position: fixed; inset: 20px; white-space: pre-wrap; font: 12px ui-monospace, monospace; color: #ff9c8a; overflow: auto; display: none; background: rgba(0,0,0,0.9); padding: 20px; z-index: 10; }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="boot"><div>Mandate of Heaven · 天命<small id="bootMsg">Gathering the court…</small></div></div>
    <pre id="error"></pre>
    <script type="module" src="/src/apps/game/main.ts"></script>
  </body>
</html>
